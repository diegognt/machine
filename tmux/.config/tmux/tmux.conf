# Set true-color
set -sg terminal-overrides ",*:RGB"  # true color support

# Options
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential

# Set prefix key
unbind C-b
set -g prefix `
bind ` send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Keybindings: split
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keybindings: reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Keybindings: windows
bind -n M-L next-window
bind -n M-H previous-window

# Theme: Status bar at the top
set-option -g status-position top
set -g status-interval 5

# Rose Pine Moon colorscheme
# Colors from rose-pine-moon palette
base="#232136"
surface="#2a273f"
overlay="#393552"
muted="#6e6a86"
subtle="#908caa"
text="#e0def4"
love="#eb6f92"
gold="#f6c177"
rose="#ea9a97"
pine="#3e8fb0"
foam="#9ccfd8"
iris="#c4a7e7"
hl_low="#2a283e"
hl_med="#44415a"
hl_high="#56526e"

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style "fg=${overlay}"
set -g pane-active-border-style "fg=${foam}"

# Theme: status (Rose Pine Moon surface bg)
set -g status-style "bg=${surface},fg=${subtle}"
set -g status-left ""
set -g status-right "#[fg=${iris},bg=${surface}] [#(~/.config/tmux/scripts/git_info.sh #{pane_current_path})] #[fg=${pine},bold][#S]  #[fg=${subtle}]%Y-%m-%d - #[fg=${foam},bold]%H:%M "

# Theme: status (windows) - dots only
set -g window-status-format " #[fg=${muted},bg=${surface}]●"
set -g window-status-current-format " #[fg=${foam},bg=${surface},bold]●"
set -g window-status-current-style "#{?window_zoomed_flag,fg=${gold},fg=${foam},bg=${surface},bold}"
set -g window-status-bell-style "fg=${love},bg=${surface},bold"
set -g window-status-activity-style "fg=${rose},bg=${surface},bold"
set -g window-status-last-style "fg=${iris},bg=${surface}"
set -g window-status-separator " "

# Copy mode
set -g mode-style "fg=${text},bg=${hl_med}"
set -g message-style "fg=${text},bg=${overlay},align=centre"
set -g message-command-style "fg=${text},bg=${overlay},align=centre"

# Copy mode selection highlight
set -g copy-mode-match-style "fg=${base},bg=${gold}"
set -g copy-mode-current-match-style "fg=${base},bg=${love}"

# Clock mode
set -g clock-mode-colour "${foam}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initializes TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
