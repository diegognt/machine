# hyprpaper config
# Wallpapers live in ~/.wallpapers/, numbered as 01.jpg, 02.jpg, 03.jpg, ...
#
# To use a different wallpaper, change the path below (or switch live with:
#     hyprctl hyprpaper preload ~/.wallpapers/02.jpg
#     hyprctl hyprpaper wallpaper ",~/.wallpapers/02.jpg")
#
# Empty monitor = fallback for all monitors.

wallpaper {
    monitor =
    path = ~/.wallpapers/01.jpg
    fit_mode = cover
}