general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(35, 33, 54, 1.0)
}

input-field {
    monitor =
    size = 400, 90
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(158, 207, 216, 1.0)
    inner_color = rgba(35, 33, 54, 1.0)
    font_color = rgba(224, 222, 244, 1.0)
    check_color = rgba(158, 207, 216, 1.0)
    fail_color = rgba(235, 111, 146, 1.0)
    fade_on_empty = true
    font_family = Noto Sans
    placeholder_text = <i>Type password...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>   $(date +'%A, %d %B')"
    color = rgba(224, 222, 244, 1.0)
    font_size = 60
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}